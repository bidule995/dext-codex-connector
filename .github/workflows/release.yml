name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dext_connector_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dext_connector_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dext_connector_test
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify version and release checks
        run: |
          node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"
          pnpm release:verify-local
          pnpm check
      - name: Build release archive and checksums
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
          tar -czf "release/dext-codex-plugin-${GITHUB_REF_NAME}.tar.gz" \
            .agents .codex-plugin .mcp.json assets plugin/runtime/dext-local-stdio.mjs \
            scripts/configure-local.ps1 scripts/show-local-status.ps1 \
            scripts/remove-local-credentials.ps1 docs \
            LICENSE NOTICE README.md SECURITY.md THIRD_PARTY_NOTICES.md
          zip -qr "release/dext-codex-plugin-${GITHUB_REF_NAME}.zip" \
            .agents .codex-plugin .mcp.json assets plugin/runtime/dext-local-stdio.mjs \
            scripts/configure-local.ps1 scripts/show-local-status.ps1 \
            scripts/remove-local-credentials.ps1 docs \
            LICENSE NOTICE README.md SECURITY.md THIRD_PARTY_NOTICES.md
          cd release
          sha256sum -- *.tgz *.tar.gz *.zip > SHA256SUMS.txt
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dext-codex-connector-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/*.tgz
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS.txt
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "${prerelease[@]}"
