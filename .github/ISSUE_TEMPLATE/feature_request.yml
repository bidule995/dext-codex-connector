name: Feature request
description: Propose a connector capability or provider integration.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow is missing?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the expected tool behavior, not secrets or real customer records.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Dext module
      options:
        - Data Health
        - Commerce
        - Prepare
        - Connector platform
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and tenancy considerations
      description: Note required scopes, write effects, destructive behavior, or tenant boundaries.
    validations:
      required: true
