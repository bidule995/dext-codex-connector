services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dext_connector
      POSTGRES_USER: dext_connector
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dext_connector"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dext_connector_postgres:/var/lib/postgresql/data

volumes:
  dext_connector_postgres:
